<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | Kabob Royale</title>
  <meta name="description" content="The page you requested could not be found. Return to Kabob Royale or view our menu.">

  <!-- Root-based in production; local-file based when previewed directly. -->
  <base id="site-base" href="/">
  <script>
    if (window.location.protocol === "file:") {
      document.getElementById("site-base").href = "./";
    }
  </script>

  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">

  <style>
    .error-header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 2;
      padding: 20px;
    }

    .error-header .logo {
      width: 160px;
      margin-inline: auto;
    }

    .error-page {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 20px 60px;
      isolation: isolate;
      overflow: hidden;
    }

    .error-page::before,
    .error-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
    }

    .error-page::before {
      background: url("./assets/images/photos/kabob-hero-1.jpg") center / cover no-repeat;
    }

    .error-page::after {
      z-index: -1;
      background: linear-gradient(180deg, hsla(0, 0%, 0%, 0.78), hsla(0, 0%, 0%, 0.9));
    }

    .error-content {
      width: min(680px, 100%);
      text-align: center;
    }

    .error-code {
      color: var(--kr-gold);
      font-family: var(--fontFamily-forum);
      font-size: clamp(9rem, 25vw, 18rem);
      line-height: 0.75;
      opacity: 0.9;
    }

    .error-title {
      margin-block: 24px 12px;
      font-size: clamp(3.6rem, 8vw, 6.4rem);
    }

    .error-text {
      max-width: 520px;
      margin-inline: auto;
      color: var(--quick-silver);
      font-size: var(--fontSize-body-3);
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-block-start: 32px;
    }

    .error-contact {
      margin-block-start: 28px;
      color: var(--quick-silver);
    }

    .error-contact a {
      display: inline;
      color: var(--kr-gold);
      font-weight: var(--weight-bold);
    }
  </style>
</head>
<body>
  <header class="error-header">
    <a href="./index.html" class="logo" aria-label="Kabob Royale home">
      <img src="./assets/images/branding/kabob-royale-logo.png" width="160" height="50" alt="Kabob Royale">
    </a>
  </header>

  <main class="error-page">
    <div class="error-content">
      <p class="error-code" aria-hidden="true">404</p>
      <p class="section-subtitle label-2">Page Not Found</p>
      <h1 class="headline-1 error-title">Looks like this plate is empty.</h1>
      <p class="error-text">
        The page may have moved or no longer exists. Head home or take a look at our menu.
      </p>

      <div class="error-actions">
        <a href="./index.html" class="btn btn-primary">
          <span class="text text-1">Back Home</span>
          <span class="text text-2" aria-hidden="true">Back Home</span>
        </a>
        <a href="./menu.html" class="btn btn-secondary">
          <span class="text text-1">View Menu</span>
          <span class="text text-2" aria-hidden="true">View Menu</span>
        </a>
        <a href="./index.html#order-online" class="btn btn-primary">
          <span class="text text-1">Order Online</span>
          <span class="text text-2" aria-hidden="true">Order Online</span>
        </a>
      </div>

      <p class="error-contact">
        Need help? Call <a href="tel:2485481111">(248) 548-1111</a>.
      </p>
    </div>
  </main>
</body>
</html>
